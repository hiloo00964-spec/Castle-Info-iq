name: Castle Info Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0,9,11,13,15,17,19,21,23 * * *"
      timezone: "Asia/Baghdad"

permissions:
  contents: write

concurrency:
  group: castle-info-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run bot
        env:
          # Telegram / AI
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}

          # Facebook
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}

          # Instagram
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}

          # Threads
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}

          # Timezone
          TIMEZONE: Asia/Baghdad

        run: python app.py

      - name: Save database and histories
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json data.backup.json 2>/dev/null || true

          git add \
            last_news_id.txt \
            last_instagram_id.txt \
            last_threads_id.txt \
            .news_history_reset \
            2>/dev/null || true

          git diff --cached --quiet || git commit -m "chore: update bot data and histories"

          git push || true
